services:
  - type: web
    name: logeshn554-trading-dashboard
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: commit
    numInstances: 1
    disk:
      name: crt-state
      mountPath: /app/runtime
      sizeGB: 1
    envVars:
      - key: CRT_STATE_DIR
        value: /app/runtime/crt
      - key: CRT_LIVE_ENABLED
        value: "0"
      - key: DASHBOARD_PUBLIC
        value: "1"
      - key: GOOGLE_ALLOWED_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DASHBOARD_SESSION_SECRET
        generateValue: true
      - key: DELTA_MCP_ENV
        value: india_prod
      - key: DELTA_API_KEY
        sync: false
      - key: DELTA_API_SECRET
        sync: false
